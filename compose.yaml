services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dating-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant_data:/qdrant/storage

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"
      interval: 10s
      timeout: 3s
      retries: 5